openapi: 3.0.3
info:
  title: BookIt API
  version: 1.0.0
paths:
  /api/appointments:
    get:
      operationId: list_appointments
      parameters:
      - in: query
        name: from
        schema:
          type: string
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: to
        schema:
          type: string
      tags:
      - appointments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAppointmentList'
          description: ''
    post:
      operationId: create_appointment
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/appointments/{appointment_id}/status:
    patch:
      operationId: update_appointment_status
      parameters:
      - in: path
        name: appointment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentStatus'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentStatus'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentStatus'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/auth/login:
    post:
      operationId: login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/auth/register:
    post:
      operationId: register
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/businesses:
    get:
      operationId: list_businesses
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      tags:
      - businesses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBusinessList'
          description: ''
    post:
      operationId: create_business
      tags:
      - businesses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BusinessWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BusinessWrite'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
          description: ''
  /api/businesses/{business_id}:
    get:
      operationId: get_business
      parameters:
      - in: path
        name: business_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - businesses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
          description: ''
    patch:
      operationId: update_business
      parameters:
      - in: path
        name: business_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - businesses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBusinessWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBusinessWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBusinessWrite'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
          description: ''
    delete:
      operationId: delete_business
      parameters:
      - in: path
        name: business_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - businesses
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/businesses/{business_id}/services:
    post:
      operationId: create_service
      parameters:
      - in: path
        name: business_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - businesses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ServiceWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ServiceWrite'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
          description: ''
  /api/businesses/{business_id}/summary:
    get:
      operationId: business_summary
      parameters:
      - in: path
        name: business_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - businesses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BusinessSummary'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/services/{service_id}:
    patch:
      operationId: update_service
      parameters:
      - in: path
        name: service_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - services
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedServiceWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedServiceWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedServiceWrite'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
          description: ''
    delete:
      operationId: delete_service
      parameters:
      - in: path
        name: service_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - services
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    Appointment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        service_id:
          type: string
          format: uuid
          readOnly: true
        service_name:
          type: string
          readOnly: true
        business_id:
          type: string
          format: uuid
          readOnly: true
        business_name:
          type: string
          readOnly: true
        client_id:
          type: string
          format: uuid
          readOnly: true
        client_full_name:
          type: string
          readOnly: true
        client_email:
          type: string
          format: email
          readOnly: true
        start_time:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/AppointmentStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - business_id
      - business_name
      - client_email
      - client_full_name
      - client_id
      - created_at
      - id
      - service_id
      - service_name
      - start_time
      - updated_at
    AppointmentCreate:
      type: object
      properties:
        service_id:
          type: string
          format: uuid
        start_time:
          type: string
          format: date-time
      required:
      - service_id
      - start_time
    AppointmentStatusEnum:
      enum:
      - Pending
      - Confirmed
      - Cancelled
      type: string
      description: |-
        * `Pending` - Pending
        * `Confirmed` - Confirmed
        * `Cancelled` - Cancelled
    AppointmentStatusStatusEnum:
      enum:
      - Confirmed
      - Cancelled
      type: string
      description: |-
        * `Confirmed` - Confirmed
        * `Cancelled` - Cancelled
    Business:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        category:
          type: string
          maxLength: 100
        owner_id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        services:
          type: array
          items:
            $ref: '#/components/schemas/Service'
          readOnly: true
      required:
      - category
      - created_at
      - id
      - name
      - owner_id
      - services
      - updated_at
    BusinessSummary:
      type: object
      properties:
        service_id:
          type: string
          format: uuid
        service_name:
          type: string
        upcoming_appointments_count:
          type: integer
        expected_revenue:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - expected_revenue
      - service_id
      - service_name
      - upcoming_appointments_count
    BusinessWrite:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        category:
          type: string
          maxLength: 100
      required:
      - category
      - name
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
      required:
      - access_token
      - expires_in
      - token_type
    PaginatedAppointmentList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Appointment'
    PaginatedBusinessList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Business'
    PatchedAppointmentStatus:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/AppointmentStatusStatusEnum'
    PatchedBusinessWrite:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        category:
          type: string
          maxLength: 100
    PatchedServiceWrite:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        duration_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
    Register:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
        full_name:
          type: string
          maxLength: 255
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - email
      - full_name
      - password
      - role
    RoleEnum:
      enum:
      - Client
      - BusinessOwner
      type: string
      description: |-
        * `Client` - Client
        * `BusinessOwner` - Business Owner
    Service:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        business_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        duration_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - business_id
      - created_at
      - duration_minutes
      - id
      - name
      - price
      - updated_at
    ServiceWrite:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        duration_minutes:
          type: integer
          maximum: 2147483647
          minimum: 0
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - duration_minutes
      - name
      - price
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        full_name:
          type: string
          maxLength: 255
        role:
          $ref: '#/components/schemas/RoleEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - full_name
      - id
      - role
      - updated_at
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
