services:
  db:
    image: postgres:16
    profiles: [dev]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - bookit_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    profiles: [dev]
    env_file: .env
    command: ["sh", "scripts/dev-entrypoint.sh"]
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  test-db:
    image: postgres:16
    profiles: [test]
    environment:
      POSTGRES_DB: bookit_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bookit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookit_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  test:
    build: .
    profiles: [test]
    environment:
      DJANGO_SECRET_KEY: test-only-secret-key-with-sufficient-length-123456
      DJANGO_DEBUG: "False"
      POSTGRES_DB: bookit_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bookit
      POSTGRES_HOST: test-db
      POSTGRES_PORT: 5432
    command: ["sh", "scripts/test-entrypoint.sh"]
    volumes:
      - .:/app
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  bookit_db_data:
