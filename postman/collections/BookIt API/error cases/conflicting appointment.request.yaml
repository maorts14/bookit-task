$kind: http-request
name: Conflicting appointment returns 409
url: '{{baseUrl}}/api/appointments'
method: POST
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: '{{client_token}}'
body:
  type: json
  content: |-
    {
      "service_id": "{{conflicting_service_id}}",
      "start_time": "{{conflicting_start_time}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 409", () => pm.response.to.have.status(409));
order: 4000
