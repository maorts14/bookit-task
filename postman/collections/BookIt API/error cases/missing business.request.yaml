$kind: http-request
name: Missing business returns 404
url: '{{baseUrl}}/api/businesses/00000000-0000-0000-0000-000000000000'
method: GET
auth:
  type: bearer
  credentials:
    token: '{{owner_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 404", () => pm.response.to.have.status(404));
order: 3000
