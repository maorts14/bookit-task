$kind: http-request
name: Locked service returns 423
url: '{{baseUrl}}/api/appointments'
method: POST
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: '{{client_token}}'
body:
  type: json
  content: |-
    {
      "service_id": "{{locked_service_id}}",
      "start_time": "{{locked_start_time}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 423", () => pm.response.to.have.status(423));
      pm.test("request was not processed", () => pm.expect(pm.response.json().detail).to.include("was not processed"));
order: 5000
