$kind: http-request
name: Client summary request returns 403
url: '{{baseUrl}}/api/businesses/{{business_id}}/summary'
method: GET
auth:
  type: bearer
  credentials:
    token: '{{client_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("returns 403", () => pm.response.to.have.status(403));
order: 2000
